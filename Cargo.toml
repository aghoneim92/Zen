[workspace]
members = ["compiler/crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
zen-diagnostics = { path = "compiler/crates/zen-diagnostics" }
zen-syntax = { path = "compiler/crates/zen-syntax" }
zen-semantics = { path = "compiler/crates/zen-semantics" }
