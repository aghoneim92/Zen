[package]
name = "zen-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
zen-format = { path = "../zen-format" }
zen-diagnostics.workspace = true
zen-syntax.workspace = true
zen-semantics.workspace = true
tower-lsp-server = "0.23"
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "sync", "macros"] }
url = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
